services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: fashion_db
      MYSQL_ROOT_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    ports:
      - "4000:4000"
    env_file: ./backend/.env
    environment:
      DATABASE_URL: mysql://root:password@mysql:3306/fashion_db
    depends_on:
      - mysql
      - redis
    command: sh -c "npx prisma migrate deploy && npx ts-node prisma/seed.ts && npm start"

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    env_file: ./frontend/.env.local
    depends_on:
      - backend

volumes:
  mysqldata:
